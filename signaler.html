<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Signaler</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Ma santé</h1>
    <div class="conteneur-boutons">
        
        <a href="index.html" class="mon-bouton">Accueil</a>

    </div>
    <p>Un harcèlement peut etre signaler par la victime elle-meme ou par un témoins.</p>
    <form action="" method="get" class="form-example">
        <div class="form-example">
            <label for="name">Entrez votre nom&nbsp;: </label>
            <input type="text" name="name" id="name" required />
        </div>
        <div class="form-example">
            <label for="prenom">Entrez votre prénom&nbsp;: </label>
            <input type="text" name="prenom" id="prenom" required />
        </div>
        <div class="form-example">
            <label for="email">Entrez votre e-mail&nbsp;: </label>
            <input type="email" name="email" id="email" required />
        </div>
        <div class="form-example">
            <label for="name">Personne que je veux contacter&nbsp;: </label>
            <select name="responsable" id="responsable">
                <option value="">--Veuillez choisir un nom--</option>
                <option value="pierre.martin@exemple.com">Pierre Martin</option>
                <option value="sebastien.tinet@exmple.com">tinet</option>
            </select>
        </div>
        <div class="form-example">
            <label for="story">Décris ta situation&nbsp;:</label>
            <br/>
            <textarea id="description" name="description" rows="5" cols="33">
            
            </textarea>
        </div>

        <div class="form-example">
            <button class="favorite styled" type="button">Ajouter aux favoris</button>
        </div>
</form>
</body>
</html>
